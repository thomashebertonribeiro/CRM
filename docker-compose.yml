version: "3.8"

services:
  backend:
    build: ./backend
    environment:
      - SERPER_KEY=${SERPER_KEY}
      - OLLAMA_KEY=${OLLAMA_KEY}
      - OLLAMA_BASE=${OLLAMA_BASE:-http://172.17.0.1:11434/v1}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-deepseek-v4-flash}
      - DATA_DIR=/app/data
      - CNPJ_API_URL=http://cnpj-api:3001
    volumes:
      - prospector_data:/app/data
    networks:
      - prospector_net
    restart: unless-stopped
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8088:80"
    depends_on:
      - backend
    networks:
      - prospector_net
    restart: unless-stopped

  cnpj-api:
    build: ./api/apps/api
    environment:
      - PORT=3001
      - NODE_ENV=production
      - CORS_ORIGIN=*
      - RF_DATA_DIR=/app/data/rf
    volumes:
      - cnpj_rf_data:/app/data/rf
    networks:
      - prospector_net
    restart: unless-stopped
    ports:
      - "3001:3001"

volumes:
  prospector_data:
  cnpj_rf_data:

networks:
  prospector_net: